# Type-checks and tests the runner, and builds its image and checks that it holds no other DevAILoop code.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: docker build -f apps/runner/Dockerfile -t devailoop-runner .
      - run: docker/check-image-source.sh devailoop-runner
